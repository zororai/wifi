include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Phase 0 throwaway spikes are separate Flutter projects.
    - spikes/**
    - "**/*.g.dart"
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
